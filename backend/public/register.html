<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="register.css">
</head>
<body>
  <div class="container">
    <a href="#" class="home-link">Home page</a>

    <div class="left">
      <img src="image.png" alt="Background" />
      <div class="overlay">
        <h1>Hello Friends</h1>
        <p>If you already have account click here<br>and grab your foods.</p>
        <button class="login-btn" onclick="window.location.href='login.html'">
          <span class="text">Login</span>
          <i class="fas fa-arrow-right"></i>
        </button>
      </div>
    </div>

    <div class="right">
      <div class="content-wrapper">
        <h2>Register Here</h2>

        <!-- ✅ START OF FORM -->
        <form action="http://localhost:3000/register" method="POST" class="input-container">
          <div class="input-group">
            <input type="text" name="username" placeholder="Username" required />
          </div>
          <div class="input-group">
            <input type="email" name="email" placeholder="Email" required />
          </div>
          <div class="input-group">
            <input type="password" name="password" placeholder="Password" required />
          </div>
          <div class="input-group">
            <input type="password" name="confirmPassword" placeholder="Confirm Password" required />
          </div>
          <button type="submit" class="register-btn">Register</button>
        </form>
        <!-- ✅ END OF FORM -->

        <p class="or">or use your account</p>
        <div class="social-icons">
          <a href="#"><i class="fab fa-facebook-f"></i></a>
          <a href="#"><i class="fab fa-google"></i></a>
          <a href="#"><i class="fab fa-linkedin-in"></i></a>
        </div>
      </div>
    </div>
  </div>
</body>
<script src="login.js"></script>
</html>
