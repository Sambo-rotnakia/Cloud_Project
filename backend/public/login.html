<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="styles_login.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    
</head>
<body>
    <div class="container">
        <a href="#" class="home-link">Home page</a>
        <div class="left">
            <div class="content-wrapper">
                <h2>Login Here</h2>
                <div class="input-container">
                    <form id="loginForm">
                        <div class="input-group">
                            <input type="email" id="email" placeholder="Email" required>
                        </div>
                        <div class="input-group">
                            <input type="password" id="password" placeholder="Password" required>
                        </div>
                        <div class="options">
                            <label>
                                <input type="checkbox">
                                <span>Remember me</span>
                            </label>
                            <a href="#">Forgot Password</a>
                        </div>
                        <button type="submit" class="login-btn">Login</button>
                    </form>
                    <p class="or">or use your account</p>
                    <div class="social-icons">
                        <a href="#"><i class="fab fa-facebook-f"></i></a>
                        <a href="#"><i class="fab fa-google"></i></a>
                        <a href="#"><i class="fab fa-linkedin-in"></i></a>
                    </div>
                    <p id="loginMessage" style="color: red; margin-top: 10px;"></p>
                </div>

            </div>
        </div>
        <div class="right">
            <img src="images/image.png" alt="Healthy Food" />
            <div class="overlay">
                <h1>Begin your path to<br> a healthier you today.</h1>
                <p>No account yet? Sign up and take your first<br>Step to healthy living!</p>
                <button class="register-btn" onclick="window.location.href='register.html'">
                    <span class="text">Register</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
