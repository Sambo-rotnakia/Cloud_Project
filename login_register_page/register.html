<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <div class="container">
        <a href="#" class="home-link">Home page</a>
        <div class="left">
            <img src="register.png" alt="Background" />
            <div class="overlay">
                <h1>Hello Friends</h1>
                <p>If you already have account click here<br>and grab your foods.</p>
                <button class="login-btn" onclick="window.location.href='login.html'">
                    <span class="text">Login</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>
        <div class="right">
            <div class="content-wrapper">
                <h2>Register Here</h2>
                <div class="input-container">
                    <div class="input-group">
                        <input type="username" placeholder="Username" required>
                    </div>
                    <div class="input-group">
                        <input type="date of birth" placeholder="Date of Birth" required>
                    </div>
                    <div class="input-group">
                        <input type="email" placeholder="Email" required>
                    </div>
                    <div class="input-group">
                        <input type="password" placeholder="Password" required>
                    </div>
                    <div class="input-group">
                        <input type="confirm password" placeholder="Confirm Password" required>
                    </div>
                    <button type="submit" class="register-btn">Register</button>
                </div>
                <p class="or">or use your account</p>
                <div class="social-icons">
                    <a href="#"><i class="fab fa-facebook-f"></i></a>
                    <a href="#"><i class="fab fa-google"></i></a>
                    <a href="#"><i class="fab fa-linkedin-in"></i></a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
